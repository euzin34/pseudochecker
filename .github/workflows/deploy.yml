name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Secret scanning (gitleaks)
        uses: zricethezav/gitleaks-action@v2
        with:
          args: '--path=.'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy pytest-cov
      - name: Lint
        run: |
          # Lint and type-check project packages and tests
          python -m ruff check src web tests --line-length 88 || true
          flake8 src web tests --max-line-length=88
          python -m mypy src
      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Placeholder - provider-specific deploy
        run: |
          echo "Add deployment steps here (Heroku/Render/Docker/etc.)"
